<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relay Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #000;
      color: #aaddff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
      color: #ffffff;
      text-shadow: 0 0 10px #00aaff;
    }

    .button-container {
      display: flex;
      gap: 20px;
    }

    .relay-button {
      background-color: #111;
      color: #aaddff;
      border: 2px solid #00aaff;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px #00aaff33;
    }

    .relay-button:hover {
      background-color: #00aaff;
      color: #000;
      box-shadow: 0 0 25px #00aaff;
    }
  </style>
</head>
<body>
  <h1>ESP32 Relay Control</h1>
  <div class="button-container">
    <button class="relay-button" onclick="setRelay(1)">Relay ON</button>
    <button class="relay-button" onclick="setRelay(0)">Relay OFF</button>
  </div>

  <script>
    const channelID = '2940658';  // Replace with your channel ID
    const apiKey = 'Y9UZSEKQI52AY8TO';  // ThingSpeak Write API Key

    function setRelay(state) {
      const url = `https://api.thingspeak.com/update?api_key=${apiKey}&field1=${state}`;
      fetch(url)
        .then(res => {
          if (res.ok) alert(`Relay ${state === 1 ? "ON" : "OFF"} command sent.`);
          else alert("Failed to send command.");
        });
    }
  </script>
</body>
</html>
